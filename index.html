<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A lightweight weather app built with vanilla JavaScript.">
    <title>Weather Forecast</title>
    <link rel="stylesheet" href="font/Rimouski.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <div class="app-title">
            <p>Weather</p>
        </div>
        <div class="notification" role="status" aria-live="polite"></div>
        <section class="weather-container" aria-label="Current weather">
            <div class="weather-icon">
                <img src="icons/unknown.png" alt="Weather conditions">
            </div>
            <div class="temperature-value">
                <p title="Click to change temperature unit">- °<span>C</span></p>
            </div>
            <div class="temperature-description">
                <p> - </p>
            </div>
            <div class="location">
                <p>-</p>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
